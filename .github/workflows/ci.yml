name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hsl
          POSTGRES_PASSWORD: hsl
          POSTGRES_DB: hsl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hsl" --health-interval 5s --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgresql://hsl:hsl@localhost:5432/hsl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4  # Spark needs a JVM for the streaming tests
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests (incl. local Spark streaming and the Postgres sink)
        run: pytest --cov-fail-under=80

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file and build images
        run: |
          docker compose --profile replay --profile live config -q
          docker compose --profile replay build
