[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsl-pipeline"
version = "0.1.0"
description = "Real-time Helsinki public transport delay pipeline: MQTT -> Kafka -> Spark Structured Streaming -> Postgres/Grafana"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hai Nguyen" }]
dependencies = [
  "pydantic>=2.6",
  "paho-mqtt>=2.0",
  "confluent-kafka>=2.4",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8", "pandas>=2.1", "pyspark==3.5.*"]
spark = ["pyspark==3.5.*", "psycopg[binary]>=3.1"]
dev = [
  "pytest>=8", "ruff>=0.5", "pyspark==3.5.*", "psycopg[binary]>=3.1",
  "pytest-cov>=5", "mypy>=1.10", "pre-commit>=3.7", "matplotlib>=3.8", "pandas>=2.1",
]

[project.scripts]
hsl-producer = "hsl_pipeline.producer:main"
hsl-replay = "hsl_pipeline.replay:main"
hsl-sample = "hsl_pipeline.sample:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=hsl_pipeline --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["hsl_pipeline"]
omit = ["*/producer.py"]  # needs the live MQTT feed

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
